name: GeneratorLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  GeneratorLog:
    type: application
    platform: iOS
    sources:
      - path: GeneratorLog
      - path: Shared
    dependencies:
      - target: GeneratorLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.generator-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: GeneratorLog/GeneratorLog.entitlements
    info:
      path: GeneratorLog/Info.plist
      properties:
        CFBundleDisplayName: Generator Test Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # PhotoField needs these. Say what the photo is actually for; Apple rejects vague strings.
        NSCameraUsageDescription: Take a photo of a generator's nameplate or a test's gauges to attach to its record.
        NSPhotoLibraryUsageDescription: Choose a photo of a generator's nameplate or a test's gauges to attach to its record.
        ITSAppUsesNonExemptEncryption: false
  GeneratorLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GeneratorLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.generator-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: GeneratorLogWidget/GeneratorLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: GeneratorLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Generator Test Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  GeneratorLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GeneratorLogTests
    dependencies:
      - target: GeneratorLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.generator-log.tests
        GENERATE_INFOPLIST_FILE: YES
  GeneratorLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GeneratorLogUITests
    dependencies:
      - target: GeneratorLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.generator-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GeneratorLog
schemes:
  GeneratorLog:
    build:
      targets:
        GeneratorLog: all
        GeneratorLogTests: [test]
        GeneratorLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: GeneratorLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: GeneratorLog/StoreKit/Products.storekit
      targets:
        - GeneratorLogTests
        - GeneratorLogUITests
    archive:
      config: Release
